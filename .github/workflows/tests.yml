name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: starter-app
        run: pip install -r requirements.txt

      - name: Run flake8
        working-directory: starter-app
        run: flake8 . --max-line-length=100 --exclude=.venv

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: starter-app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: starter-app
        run: pytest -v
